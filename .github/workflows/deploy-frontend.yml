name: Deploy Next.js Frontend to EC2

on:
  push:
    branches:
      - main # Triggers the build when pushing to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Update this if you use a different Node version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Copy Build Artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Add 'next.config.js' or 'next.config.mjs' to this list if your app uses one
          source: ".next,public,package.json,package-lock.json"
          target: ${{ secrets.TARGET_DIR }}
          overwrite: true
          # The strip_components flag prevents creating extra nested directories on the server
          strip_components: 0 

      - name: Install Production Modules and Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.TARGET_DIR }}
            
            # Install production dependencies directly on the server to avoid binary conflicts
            npm ci --omit=dev
            
            # Restart the existing PM2 process, or start it if it doesn't exist
            pm2 restart frontend || pm2 start npm --name "frontend" -- start
            pm2 save
